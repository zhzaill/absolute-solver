<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Absolute Solver / 本机连接</title>
  <style>
    :root{color-scheme:light;--ink:#17202b;--muted:#727f8f;--line:#dce4ed;--ok:#18a76d;--ok-soft:#e7f8f0;--bad:#dd5262;--panel:#fff}
    *{box-sizing:border-box}html,body{width:100%;height:100%;margin:0}body{display:grid;place-items:center;background:#f3f6f9;color:var(--ink);font:13px/1.45 "Segoe UI","Microsoft YaHei",sans-serif}
    main{width:min(360px,calc(100vw - 20px));background:var(--panel);border:1px solid var(--line);border-radius:8px;box-shadow:0 12px 36px rgba(26,42,58,.14);overflow:hidden}
    .body{padding:18px 18px 14px;display:grid;grid-template-columns:64px 1fr;gap:14px;align-items:center}
    .icon{width:64px;height:64px;border-radius:50%;display:grid;place-items:center;background:var(--ok-soft);color:var(--ok)}
    .icon svg{width:38px;height:38px;fill:none;stroke:currentColor;stroke-width:3.2;stroke-linecap:round;stroke-linejoin:round}
    h1{font-size:17px;line-height:1.2;margin:0 0 5px;font-weight:650}.state{display:flex;align-items:center;gap:7px;font-weight:600;color:var(--ok)}
    .dot{width:8px;height:8px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 4px var(--ok-soft)}.state.off{color:var(--bad)}.state.off .dot{background:var(--bad);box-shadow:0 0 0 4px #fdebed}
    .meta{margin-top:7px;color:var(--muted);font:11px "Cascadia Mono",Consolas,monospace;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    #subtitle{display:none;padding:10px 18px;border-top:1px solid var(--line);background:#fafcfe;color:#344255;font-size:12px;line-height:1.5;max-height:72px;overflow:auto}
    #subtitle.on{display:block}
    footer{padding:10px 18px 14px;display:flex;align-items:center;justify-content:space-between;gap:10px;border-top:1px solid var(--line)}
    footer span{color:var(--muted);font-size:11px}button{font:inherit;color:#175f48;background:#ecf8f2;border:1px solid #bfe7d5;border-radius:4px;padding:5px 9px;cursor:pointer}button:hover{border-color:var(--ok)}button[aria-pressed="true"]{color:var(--muted);background:#f5f7f9;border-color:var(--line)}
    body.standby .icon{background:#eef1f4;color:#7c8795}body.standby .state{color:var(--muted)}body.standby .dot{background:#94a0af;box-shadow:0 0 0 4px #eef1f4}
    @media(max-width:360px){.body{grid-template-columns:54px 1fr;padding:14px}.icon{width:54px;height:54px}.icon svg{width:32px;height:32px}h1{font-size:16px}}
  </style>
</head>
<body>
  <main>
    <section class="body">
      <div class="icon" aria-hidden="true">
        <svg viewBox="0 0 64 64">
          <path d="M32 6 53 14v15c0 14-8.5 24.6-21 29C19.5 53.6 11 43 11 29V14Z"></path>
          <path d="m21 31.5 7.3 7.2L43.5 23"></path>
        </svg>
      </div>
      <div>
        <h1>Absolute Solver</h1>
        <div class="state" id="state"><i class="dot"></i><span id="stateText">正在连接</span></div>
        <div class="meta" id="endpoint">ws://--</div>
      </div>
    </section>
    <div id="subtitle" role="status" aria-live="polite"></div>
    <footer><span id="detail">本机 Body 已注册后会显示在此</span><button id="sound" aria-pressed="false">启用声音</button></footer>
  </main>
  <script defer src="/main.js"></script>
</body>
</html>
