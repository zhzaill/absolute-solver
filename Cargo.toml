[package]
name = "absolute-solver"
version = "0.3.0"
edition = "2021"
description = "Absolute Solver hub monitor and reconnecting body client"

[dependencies]
axum = { version = "0.7", features = ["ws"] }
base64 = "0.22"
futures-util = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["json", "multipart"] }
rusqlite = { version = "0.31", features = ["bundled"] }
schemars = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time", "net", "fs", "io-util"] }
tokio-tungstenite = "0.24"
uuid = { version = "1", features = ["v4"] }

[[bin]]
name = "absolute-solver-hub"
path = "src/bin/hub.rs"

[[bin]]
name = "absolute-solver-body"
path = "src/bin/body.rs"

[[bin]]
name = "absolute-solver-protocol-schema"
path = "src/bin/protocol_schema.rs"
