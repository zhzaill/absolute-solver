name: ci

on:
  push:
  pull_request:

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - name: Format
        run: cargo fmt --check
      - name: Test
        run: cargo test
      - name: Generate protocol schemas
        run: cargo run --bin absolute-solver-protocol-schema -- schemas
      - name: Check generated schemas
        run: git diff --exit-code -- schemas
