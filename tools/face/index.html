<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark light">
<meta name="theme-color" content="#0b0d14">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Absolute Solver · 对话</title>
<link rel="manifest" href="/face/manifest.webmanifest">
<link rel="icon" href="/face/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/face/icon.svg">
<link rel="stylesheet" href="/face/face.css">
</head>
<body class="chat-page">
  <div class="app">
    <header class="topbar">
      <div class="brand">
        <span class="pulse" id="pulse"></span>
        <span class="name">Cortico</span>
      </div>
      <div class="topbar-tools">
        <a class="switch-link" href="/figure" title="切到人物界面" aria-label="切到人物界面">
          <svg viewBox="0 0 24 24" width="15" height="15" aria-hidden="true"><circle cx="12" cy="8" r="3.3" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M5 20c0-3.6 3.1-6 7-6s7 2.4 7 6" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
          <span>人物</span>
        </a>
        <span id="conn" class="pill" data-state="connecting">连接中</span>
      </div>
    </header>

    <section class="chat chat-main" aria-label="对话">
      <div class="messages" id="messages" role="log" aria-live="polite"></div>
      <form class="composer" id="composer" autocomplete="off">
        <button id="mic" class="mic" type="button" aria-pressed="false" title="语音输入">
          <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M12 3a3 3 0 0 0-3 3v6a3 3 0 0 0 6 0V6a3 3 0 0 0-3-3Z" fill="currentColor"/><path d="M5.5 11.5a6.5 6.5 0 0 0 13 0M12 18v3M9 21h6" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
        </button>
        <textarea id="input" class="input" rows="1" placeholder="和她说点什么…" maxlength="500"></textarea>
        <button id="send" class="send" type="submit">发送</button>
      </form>
      <div class="footline">
        <span id="hint" class="hint">同一个 Persona · 语音与模型在主机侧设置</span>
      </div>
    </section>
  </div>
  <script type="module" src="/face/chat.js"></script>
</body>
</html>
