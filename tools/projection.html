<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Absolute Solver 服务目录</title>
  <link rel="stylesheet" href="/projection.css">
  <script defer src="/projection.js"></script>
</head>
<body>
  <header>
    <div><p class="eyebrow">ABSOLUTE SOLVER</p><h1>服务目录</h1><p id="host-label">正在连接 Host…</p></div>
    <a href="/" target="_blank" rel="noreferrer">打开 Coo 原生桌宠</a>
  </header>
  <main>
    <div class="section-head"><p id="refresh-state">正在检查</p><button id="refresh" type="button">刷新</button></div>
    <div class="table-wrap"><table>
      <thead><tr><th>服务</th><th>Host / 地址</th><th>状态</th><th>版本</th><th>能力</th><th>入口</th></tr></thead>
      <tbody id="services"><tr><td colspan="6">正在读取服务目录</td></tr></tbody>
    </table></div>
    <p class="note">桌宠、打字、语音输入、气泡、动作和 TTS 播放均由 Coo 原页面负责；本页只显示服务健康状态。</p>
  </main>
</body>
</html>
